name: Sync to Hugging Face Hub

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::notice ::HF_TOKEN is not configured in GitHub Secrets. Skipping Hugging Face Space sync."
            exit 0
          fi
          git config --global user.email "shivam@smartvision.com"
          git config --global user.name "shivam8858"
          git lfs install
          git remote add hf https://shivam8858:${HF_TOKEN}@huggingface.co/spaces/shivam8858/smartVision_Attendance_Portal || true
          git push --force hf master:main
