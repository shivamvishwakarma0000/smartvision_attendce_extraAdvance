services:
  - type: web
    name: smartvision-attendance-portal
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    
    # Define environment variables
    envVars:
      - key: DATABASE_URL
        value: sqlite:////app/instance/smartvision.db
      - key: SECRET_KEY
        value: "sv-prod-7f3a9e2b1c4d6f8a0e5b2c9d4f7a1e3b6c8d0f2a5e7b9c1d3f5a7e9b2c4d6f"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_USE_TLS
        value: "true"
      - key: SMTP_SENDER_EMAIL
        sync: false

